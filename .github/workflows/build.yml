name: Build Unsigned IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Buds3ProMonitor (.ipa)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive unsigned Release build
        run: |
          xcodebuild archive \
            -project Buds3ProMonitor.xcodeproj \
            -scheme Buds3ProMonitor \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/Buds3ProMonitor.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          rm -rf Payload Buds3ProMonitor.ipa
          mkdir -p Payload
          cp -R build/Buds3ProMonitor.xcarchive/Products/Applications/Buds3ProMonitor.app Payload/
          zip -r Buds3ProMonitor.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Buds3ProMonitor-IPA
          path: Buds3ProMonitor.ipa
          if-no-files-found: error
