name: Buds3ProMonitor
options:
  bundleIdPrefix: com.buds3pro
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""

targets:
  Buds3ProMonitor:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.buds3pro.monitor
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Buds3 Pro Monitor
        NSBluetoothAlwaysUsageDescription: "Kulaklık pil durumunu okumak için Bluetooth izni gerekiyor."
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UIBackgroundModes:
          - audio
        LSApplicationQueriesSchemes:
          - App-Prefs
