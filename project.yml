name: Buds3ProMonitor
options:
  bundleIdPrefix: com.buds3pro
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""

targets:
  Buds3ProMonitor:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    dependencies:
      - target: BudsWidget
        embed: true
    entitlements:
      path: Sources/Buds3ProMonitor.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.buds3pro.monitor
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sources/Buds3ProMonitor.entitlements
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Buds3 Pro
        NSBluetoothAlwaysUsageDescription: "Kulaklık pil durumunu okumak için Bluetooth izni gerekiyor."
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UIBackgroundModes:
          - audio
        LSApplicationQueriesSchemes:
          - App-Prefs

  BudsWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Widget
    entitlements:
      path: Widget/BudsWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.buds3pro.monitor.widget
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_ENTITLEMENTS: Widget/BudsWidget.entitlements
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: "YES"
    info:
      path: WidgetInfo.plist
      properties:
        CFBundleDisplayName: Buds3 Pro Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
